<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/">My Educational Platform</a>
            </div>
            <ul>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h1>{{ post.title }}</h1>
            <p class="author">By {{ post.author }}</p>
            <p class="date">Published on {{ post.publication_date.strftime('%Y-%m-%d') }}</p>
            <div class="content">
                {{ post.content | safe }}
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2023 My Educational Platform</p>
    </footer>
</body>
</html>
